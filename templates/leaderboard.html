<!DOCTYPE html>
<html>
    <head>

        <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000 !important; /
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }

        #leaderboard {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            background-color: #000;
        }

        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
        }

        button:hover {
            background: #333;
        }

        table {
            width: 100%;
            max-width: 1000px;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid #222;
            color: #666;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #111;
        }


        .user-name {
            color: white;
        }
        </style>
    </head>
    <body>
        <div id="leaderboard">
            <div id="controls">
                <button onclick="updatelb('messages')">Top Messages</button>
                <button onclick="updatelb('click_contribution')">Top Clicks</button>
                <button onclick="updatelb('purchases_today')">Top Buyers</button>
            </div>
            <h2 id="title">
                Leaderboard
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>User</th>
                        <th id="count">Count</th>
                    </tr>
                </thead>
                <tbody id="data"></tbody>
            </table>
        </div>
        <script>
            async function updatelb(type) {
                const resp = await fetch(`/api/v2/session/nodes/data-cluster-pools/${type}`);
                const data = await resp.json()
                const tbody = document.getElementById('data')
                const title = document.getElementById('title')
                const column = document.getElementById('count')
                title.innerText = type.replace('_', ' ').toUpperCase();
                if (type === 'messages') {
                    column.innerText = 'Messages Today';
                } else if (type === 'click_contribution') {
                    column.innerText = 'Clicks Contributed Between Milestones';
                } else {
                    column.innerText = 'Purchases Today';
                }
                tbody.innerHTML = '';
                data.output.forEach((user, index) => {
                    const countVal = (user[2] !== undefined && user[2] !== null) ? user[2].toLocaleString() : 0;
                    const colorStyle = user[1] ? user[1] : "color: white";

                    const row = `
                    <tr>
                        <td style="color: #444;">#${index + 1}</td>
                        <td style="${customStyle}"><strong>${user[0]}</strong></td>
                        <td style="color: #fff;">${countVal}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
                });
            }

            updatelb('messages');
        </script>
    </body>
</html>
