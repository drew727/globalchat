<!DOCTYPE html>
<html>
    <head>
        <style>
            <style>

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #leaderboard {
        width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
    }

    #controls {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
    }

    button {
        background: #222;
        color: white;
        border: 1px solid #444;
        padding: 10px 20px;
        cursor: pointer;
        transition: background 0.2s;
    }

    button:hover {
        background: #333;
    }

    h2 {
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        max-width: 1200px;
        border-collapse: collapse;
        text-align: left;
    }

    th {
        border-bottom: 2px solid #333;
        padding: 15px;
        color: #888;
        text-transform: uppercase;
        font-size: 0.8rem;
    }

    td {
        padding: 15px;
        border-bottom: 1px solid #111;
        font-size: 1.1rem;
    }


    #data tr {
        transition: background 0.1s;
    }

    #data tr:hover {
        </style>
    </head>
    <body>
        <div id="leaderboard">
            <div id="controls">
                <button onclick="updatelb('messages')">Top Messages</button>
                <button onclick="updatelb('click_contribution')">Top Clicks</button>
                <button onclick="updatelb('purchases_today')">Top Buyers</button>
            </div>
            <h2 id="title">
                Leaderboard
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>User</th>
                        <th id="count">Count</th>
                    </tr>
                </thead>
                <tbody id="data"></tbody>
            </table>
        </div>
        <script>
            async function updatelb(type) {
                const resp = await fetch(`/api/v2/session/nodes/data-cluster-pools/${type}`);
                const data = await resp.json()
                const tbody = document.getElementById('data')
                const title = document.getElementById('title')
                const column = document.getElementById('count')
                title.innerText = type.replace('_', ' ').toUpperCase();
                if (type === 'messages') {
                    column.innerText = 'Messages Today';
                } else if (type === 'click_contribution') {
                    column.innerText = 'Clicks Contributed Between Milestones';
                } else {
                    column.innerText = 'Purchases Today';
                }
                tbody.innerHTML = '';
                data.output.forEach((user, index) => {
                    const countVal = (user[2] !== undefined && user[2] !== null) ? user[2].toLocaleString() : 0;
                    const row = `
                    <tr style="${user[1] ? user[1] + ' !important' : 'color: white'}">
                    <td>#${index + 1}</td>
                    <td><strong>${user[0]}</strong></td>
                        <td>${countVal}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
                });
            }

            updatelb('messages');
        </script>
    </body>
</html>
