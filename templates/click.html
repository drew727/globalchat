   <!DOCTYPE html>
    <html>
    <head>
        <title>Click!</title>
        <style>
        body {
            background-color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Roboto, sans-serif;
            background-image:
                radial-gradient(1px 1px at 50px 100px, white, transparent),
                radial-gradient(1.5px 1.5px at 300px 400px, white, transparent),
                radial-gradient(1px 1px at 15% 15%, white, transparent),
                radial-gradient(2px 2px at 250px 250px, rgba(255, 255, 255, 0.8), transparent); /* Combined and cleaned */
            background-repeat: repeat;
            background-size: 300px 300px;
            animation: pan-bg 100s linear infinite;
        }
            @keyframes pan-bg{
                from { background-position: 0 0; }
                to { background-position: -300px -300px; }
            }

            #counter {
                background-color: black;
                color: white;
                margin-bottom: 10px;
                font-size: 24px;
                border: none;
                height: 50px;
                width: auto;
            }
            #globes {
                position: fixed;
                background-color: black;
                color: white;
                margin-bottom: 10px;
                top: 20px;
                right: 20px;
                font-size: 24px;
                border: none;
                height: 50px;
                width: auto;
            }
            #globe {
                position: relative;
                left: 50px;
                border: 2px solid white;
                width: 500px;
            }
            #navbar {
                width: 200px;
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 40px;
                left: 20px;
                gap: 10px;
                padding: 0;
            }

    .btn {
        width: 100%;
        padding: 12px;
        background-color: #9db1b3;
        color: black;
        font-size: 18px;
        border-radius: 10px;
        border: 4px solid gray;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        cursor: pointer;
        box-sizing: border-box;
    }

        #globe {
            cursor: pointer;
            transition: transform 0.1s;
        }
        #globe:active {
            transform: scale(0.98);
        }
    </style>
        <script src="https://unpkg.com/three"></script>
        <script src="https://unpkg.com/globe.gl"></script>
        <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">
    </head>

    <body>
        <button type="button" id='counter' onclick='clicked()'>loading...</button>
           <div style="width: 300px; background: #333; height: 10px; border-radius: 5px; margin-bottom: 20px;">
    <div id="progress" style="width: 0%; background: #4CAF50; height: 100%; border-radius: 5px; transition: width 0.3s;"></div>
</div>
<div id="navbar">
    <button class='btn' id='register' onclick="window.location.href='/sys/auth/provisioning/node-enrollment'"><strong>Register!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/observer-instance.html'"><strong>Chat!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/system-diagnostics'"><strong>Click!</strong></button>
    <button class='btn' onclick='window.location.href = "/sys/local-storage/mount-points/registry"'><strong>Inventory!</strong></button>
    <button class='btn' onclick="window.location.href='/internal/assets/resource-catalog/deployment-manifest'"><strong>Shop!</strong></button>
    </div>
        <div id="globes"><p>Globes: </p></div>
        <div id='globe'></div>





        <script>
        window.onload = changebutton;
            function changebutton() {
                fetch('/api/v2/user-profile/cache/sync-manifest')
                .then(response => response.json())
                .then(user => {
                    if (user.isguest === false) {
                        document.getElementById('register').innerText = user.username;
                        document.getElementById('register').onclick = () => { window.location.href = '/api/v2/user-profile/cache/sync-manifest'; };
                    }
                });
            }

            if (window.location.protocol === 'http:') {
                window.location.replace(window.location.href.replace('http:', 'https:'));
            }
            const radius = 100;
            const rotatingglobe = document.getElementById('globe');
            rotatingglobe.addEventListener('click', clicked)
            document.addEventListener('keyup', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                    clicked();
                }
            });
            const globeimg = 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
            const bump = 'https://unpkg.com/three-globe/example/img/earth-topology.png';
            const globe = Globe()(rotatingglobe)
            globe.globeImageUrl(globeimg)
            globe.bumpImageUrl(bump)
            globe.controls().enabled = false;
            globe.width(500);
            globe.height(500);
            let globelng = 0;
            let rotationQueue = [];
            let isRotating = false;
            let idle = true;
            let callbackTriggered = false;
            let localCount = 0;
            let next_ms = 0;
            function clicked() {
                localCount++;
                counterupdate(localCount, next_ms);
                rotationQueue.push(true);
                postcount();
                console.log(idle)
                console.log(isRotating)
                if (idle === true) {
                    idle = false;
                    processRotations();
                }

            }

            function processRotations() {
                if (isRotating) {
                    return;
                }
                if (!(rotationQueue.length > 0)){
                    idle = true;
                    return

                }

                isRotating = true;
                rotationQueue.shift();
                globelng = globelng - 10;
                const lat = globe.pointOfView().lat;
                const alt = globe.pointOfView().altitude;
                console.log(lat)
                console.log(alt)
                console.log(isRotating)
                console.log(idle)
                globe.pointOfView({lat: lat, lng: globelng, altitude: alt}, 50, () => {
                    isRotating = false;
                    callbackTriggered = true;
                    if (rotationQueue.length === 0) {
                        idle = true;
                    } else {
                        processRotations();
                    }
                });
                setTimeout(() => {
                    isRotating = false;
                    processRotations();
                }, 50);
            }
            function postcount() {
                fetch('/api/v1/telemetry/heartbeat/delta-increment', {
                    method: 'POST',
                }).then(response => response.json()).then(data => {


                    localCount = data.count;
                    counterupdate(data.count, data.next_milestone);


                    const globes = document.getElementById('globes');
                    globes.innerHTML = `<p>Globes: ${data.globes}</p>`;
                    const percent = (data.count / data.next_milestone) * 100;
                    document.getElementById('progress').style.width = percent + '%';

                });
            }
            function counterupdate(count, milestone) {
                if (milestone) next_ms = milestone;

                const counter = document.getElementById('counter');
                const milestoneText = milestone ? `Next Milestone: ${milestone}` : "Calculating...";
                counter.innerHTML = `People Clicked This ${count} Times! ${milestoneText}`;
}
            function frame() {
                fetch('/api/v1/telemetry/heartbeat/delta-increment').then(response => response.json()).then(data => {
                    counterupdate(data.count, data.next_milestone)
                    const globes = document.getElementById('globes');
                    globes.innerHTML = `<p>Globes: ${data.globes}</p>`;
                    const percent = (data.count / data.next_milestone) * 100;
                    document.getElementById('progress').style.width = percent + '%';
                });
            }
            setInterval(frame, 1000);
            frame()
        </script>
    </body>
    </html>
