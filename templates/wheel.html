<!DOCTYPE html>
<html>
    <head>
        <title>Wheel!</title>
        <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">

        <style>
        #globes p, body > p {
            position: absolute;
            z-index: 10;
        }
        body {
            background-color: #f0f2f5;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 50px;
        }
        #wheel {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 5px solid #333;
            position: relative;
            overflow: hidden;
            margin: 50px auto;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }
    #wheel::after {
        content: "";
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 50px; height: 50px;
        background: #333;
        border-radius: 50%;
        border: 4px solid white;
        z-index: 30;
    }
    .slice {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        transform-origin: 50% 50%;

    }
    .slice p {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        color: white;
        font-weight: bold;
        text-shadow: 1px 1px 2px black;
        width: 100px;
        text-align: center;
        white-space: normal;
        z-index: 100;
    }

    #spinwheel {
        padding: 15px 40px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background: #e63946;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        transition: 0.2s;
    }
    #spinwheel:hover { background: #d62828; transform: scale(1.05); }


    #navbar {
        width: 220px;
        padding: 10px;
        background: white;
        position: fixed;
        top: 20%; left: 20px;
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .btn {
        margin: 5px 0;
        padding: 10px;
        border: 1px solid #eee;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn:hover { background: #f8f9fa; border-color: #ccc; }
        </style>


    </head>
    <body>
    <nav id="navbar">
        <button class='btn' id='register' onclick="window.location.href='/sys/auth/provisioning/node-enrollment'"><strong>Register!</strong></button>
        <button class='btn' onclick="window.location.href='/api/v1/session/sync/view-instance.html'"><strong>Chat!</strong></button>
        <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/system-diagnostics'"><strong>Click!</strong></button>
        <button class='btn' onclick='window.location.href = "/sys/local-storage/mount-points/registry"'><strong>Inventory!</strong></button>
        <button class='btn' onclick="window.location.href='/internal/assets/resource-catalog/deployment-manifest'"><strong>Shop!</strong></button>
    </nav>
    <div id="globes">
        <p>Globes:
            <span id="globecount">loading...</span>
            <img src="/static/download-removebg-preview.png" width='30px' height='30px'>
        </p>
    </div>
    <p>Purchases Today: <span id="purchases-today">0</span></p>
    <p>Purchases Yesterday: <span id="purchases-yesterday">0</span></p>
    <button id="spinwheel" onclick="spinWheel()">Spin Wheel!</button>
    <div id="wheel">

    </div>

    <script>
    function sliceclip(count) {
        const ang = 360 / count;
        const rad = (ang / 2) * (Math.PI / 180);
        const tan = Math.tan(rad) * 50;
        const x1 = 50 - tan;
        const x2 = 50 + tan;
        return `polygon(50% 50%, ${x1}% 0%, ${x2}% 0%)`;
    }
    let prizes = [];
    function getWheel() {
        const wheel = document.getElementById('wheel');
        fetch('/api/v1/assets/content/daily-configurations')
            .then(response => response.json())
            .then(data => {
                prizes = data.prizes
                wheel.innerHTML = ""

                prizes.forEach((prize, index) => {
                    const angle = 360 / prizes.length;
                    const rotation = index * angle;
                    const clip = sliceclip(prizes.length)


                    wheel.innerHTML += `<div class="slice" style="clip-path: ${clip}; transform: rotate(${rotation}deg); background-color: hsl(${rotation}, 70%, 60%)">
                    <p style="transform: translateX(-50%) rotate(90deg); transform-origin: top center;">
                ${prize.label}
            </p></div>`

                });

            });
    }
    function spinWheel() {
        const wheel = document.getElementById('wheel')
    }

    getWheel();

    </script>
    </body>
</html>
