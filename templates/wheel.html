<!DOCTYPE html>
<html>
    <head>
        <title>Wheel!</title>
        <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">

        <style>
        #wheel {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 2px solid black;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }
        .slice {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: 50% 50%;
        }
        #navbar {
            width: 200px;
            height: 300px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 25%;
            left: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }
        p {
            position: absolute;
            z-index: 9999;
        }
        </style>


    </head>
    <body>
    <nav id="navbar">
        <button class='btn' id='register' onclick="window.location.href='/sys/auth/provisioning/node-enrollment'"><strong>Register!</strong></button>
        <button class='btn' onclick="window.location.href='/api/v1/session/sync/view-instance.html'"><strong>Chat!</strong></button>
        <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/system-diagnostics'"><strong>Click!</strong></button>
        <button class='btn' onclick='window.location.href = "/sys/local-storage/mount-points/registry"'><strong>Inventory!</strong></button>
        <button class='btn' onclick="window.location.href='/internal/assets/resource-catalog/deployment-manifest'"><strong>Shop!</strong></button>
    </nav>
    <div id="globes">
        <p>Globes:
            <span id="globecount">loading...</span>
            <img src="/static/download-removebg-preview.png" width='30px' height='30px'>
        </p>
    </div>
    <p>Purchases Today: <span id="purchases-today">0</span></p>
    <p>Purchases Yesterday: <span id="purchases-yesterday">0</span></p>
    <button id="spinwheel" onclick="spinWheel()">Spin Wheel!</button>
    <div id="wheel">

    </div>

    <script>
    function sliceclip(count) {
        const ang = 360/count;
        const rad = (ang/2) * (Math.PI /180);
        const x = 50 + Math.tan(rad) * 50;
        return `polygon(50% 50%, 50% 0%, ${x}% 0%)`
    }
    let prizes = [];
    function getWheel() {
        const wheel = document.getElementById('wheel');
        fetch('/api/v1/assets/content/daily-configurations')
            .then(response => response.json())
            .then(data => {
                document.getElementById('globecount').innerHTML = data.status;
                prizes = data.prizes
                const clip = sliceclip(prizes.length)

                wheel.innerHTML = ""

                prizes.forEach((prize, index) => {
                    wheel.innerHTML += `<div class="slice" style="clip-path: ${clip}; transform: rotate(${index * (360 / prizes.length)}deg); background-color: hsl(${index * (360 / prizes.length)}, 70%, 60%)"><p>${prize.label}</p></div>`

                });

            });
    }
    function spinWheel() {
        const wheel = document.getElementById('wheel')
    }

    getWheel();

    </script>
    </body>
</html>
