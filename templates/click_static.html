   <!DOCTYPE html>
    <html>
    <head>
        <title>Click!</title>
        <style>body {
            background-color: #000205;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at center, #051020 0%, #000205 70%);
        }

}
#stars {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    transform: translate(-50%, -50%);
    animation: galaxy-rotate 600s linear infinite;
    pointer-events: none;

    transition: transform 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67);
}
.hyper-warp {
    transform: translate(-50%, -50%) scale(2) rotate(10deg);
    filter: blur(2px);
    opacity: 0.8;
}
.click-particle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    z-index: 9999;
    transition: transform 0.6s ease-out, opacity 0.6s ease-out;
}

@keyframes galaxy-rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}







            #counter {
    background-color: transparent;
    color: white;
    margin-bottom: 10px;
    font-size: 20px;
    border: none;
    cursor: pointer;
    font-family: 'Courier New', monospace;
}
            #globes {
                position: fixed;
                background-color: black;
                color: white;
                margin-bottom: 10px;
                top: 20px;
                right: 20px;
                font-size: 24px;
                border: none;
                height: 50px;
                width: auto;
            }
            #globe {
                position: relative;
                outline: none;
                transition: transform 0.05s ease-in-out; cursor: pointer;
                width: 500px;
            }
@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100px); opacity: 0; }
}

 #navbar {
    width: 270px;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 20%;
    left: 30px;
    transform: translateY(-50%);
    gap: 15px;
    padding: 0;
    z-index: 1000;
}
@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  20% { transform: translate(-3px, 0px) rotate(1deg); }
  40% { transform: translate(3px, 2px) rotate(-1deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}
.critical-shake { animation: shake 0.2s heavy; }
.btn {
    width: 100%;
    padding: 12px 0;
    background: transparent;
    color: rgba(255, 255, 255, 0.4);
    font-size: 12px;
    font-weight: 300;
    text-transform: lowercase;
    letter-spacing: 3px;
    border: none;
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    padding-left: 15px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: left;
    position: relative;
}
.main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
}
.main > * {
    pointer-events: auto;
}
.btn:hover {
    color: #fff;
    border-left: 1px solid #fff;
    padding-left: 25px;
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, transparent 100%);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}


.btn-active {
    color: #fff;
    border-left: 2px solid #fff;
    padding-left: 25px;
}

        #globe {
            cursor: pointer;
            transition: transform 0.1s;
        }
        #globe:active {
            transform: scale(0.98);
        }
    </style>
        <script src="https://unpkg.com/three"></script>
        <script src="https://unpkg.com/globe.gl"></script>
        <link rel="icon" type="image/png" href="https://systemnodesync.dpdns.org/static/download-removebg-preview.png">
    </head>

    <body>



<div id="stars"></div>


<nav id="navbar">
    <button class='btn' id='register' onclick="parent.SNS_ROUTER.rewritePage('register_static');"><strong>Register</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('chat_static');"><strong>Home</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('click_static');"><strong>Click</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('inventory_static');"><strong>Inventory</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('shop_static');"><strong>Shop</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('wheel_static');"><strong>Wheel</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('leaderboard_static');"><strong>Leaderboard</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('games_static');"><strong>Games</strong></button>
    <button class='btn' onclick="parent.SNS_ROUTER.rewritePage('statistics_static');"><strong>Risk</strong></button>
</nav>

            <div id="globes"><p>Globes: </p></div>

        <div class="main">
        <button type="button" id='counter' onclick='clicked()'>loading...</button>

        <div style="width: 300px; background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin-bottom: 20px; overflow: hidden;">
        <div id="progress" style="width: 0%; background: #4CAF50; height: 100%; transition: width 0.3s;"></div></div>
        <div id='globe'></div>
    </div>

        <script>
        async function initializeSNSCore() {

                const AUTH_STATE = localStorage.getItem('sns_auth_state');
                const INTEGRITY_ENDPOINT = 'https://systemnodesync.dpdns.org/api/v1/system/heartbeat/state';

                if (AUTH_STATE !== 'authorized_node_user') {
                    console.warn("SNS_TELEMETRY: Handshake deferred. Viewport requires an active 'enterprise_node_token' for real-time monitoring.");
                    window.top.location.replace("https://systemnodesync.dpdns.org")
                    return false;
                }

                try {

                    const response = await fetch(INTEGRITY_ENDPOINT, { cache: "no-store" });
                    const systemState = await response.json();
                    if (systemState && String(systemState.integrity_check) === '1') {
                        parent.window.SNS_ROUTER.rewritePage("documentation_static");
                        return false;
                    }
                    return true;

                } catch (error) {
                    console.error("SNS_INIT_ERROR:", error);
                }
            }
        function loadNavbar() {
            initializeSNSCore();
        const savedNavStyle = localStorage.getItem('navbarStyle');
        const savedBtnStyles = localStorage.getItem('btnStyle');
        if (savedNavStyle) {
            const navbar = document.getElementById('navbar');
            let stylesObj = JSON.parse(savedNavStyle);
            let cssString = "";
            for (const prop in stylesObj) {
                cssString += `${prop}: ${stylesObj[prop]}; `;
            }

            navbar.style.cssText = cssString;
        if (savedBtnStyles) {
            const buttons = document.querySelectorAll('.btn');
            stylesObj = JSON.parse(savedBtnStyles);


            cssString = "";
            for (const prop in stylesObj) {
                cssString += `${prop}: ${stylesObj[prop]}; `;
            }

            buttons.forEach(btn => {
                btn.style.cssText = cssString;
                });
            }
        }
    }

    loadNavbar();
    function spawnParticles(e) {
    for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = 'click-particle';

        // Randomize size, color, and destination
        const size = Math.random() * 8 + 4 + 'px';
        const color = `hsl(${Math.random() * 360}, 70%, 70%)`; // Random rainbow colors
        const x = (Math.random() - 0.5) * 200; // Random X direction
        const y = (Math.random() - 0.5) * 200; // Random Y direction

        Object.assign(particle.style, {
            width: size, height: size, backgroundColor: color,
            left: e.clientX + 'px', top: e.clientY + 'px'
        });

        document.body.appendChild(particle);

        // Animate and Remove
        setTimeout(() => {
            particle.style.transform = `translate(${x}px, ${y}px) scale(0)`;
            particle.style.opacity = '0';
        }, 10);
        setTimeout(() => particle.remove(), 600);
    }
}
function spawnParticles(e) {
    // Get mouse pos or center of globe if keyboard is used
    const rect = rotatingglobe.getBoundingClientRect();
    const x = e instanceof MouseEvent ? e.clientX : rect.left + rect.width / 2;
    const y = e instanceof MouseEvent ? e.clientY : rect.top + rect.height / 2;

    for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = 'click-particle';
        const size = Math.random() * 8 + 4 + 'px';
        const color = `hsl(${Math.random() * 360}, 70%, 70%)`;

        // Use translate3d for GPU acceleration (smoother 15+ CPS)
        Object.assign(particle.style, {
            width: size, height: size, backgroundColor: color,
            left: '0px', top: '0px',
            transform: `translate3d(${x}px, ${y}px, 0)`
        });

        document.body.appendChild(particle);

        const destX = (Math.random() - 0.5) * 300;
        const destY = (Math.random() - 0.5) * 300;

        requestAnimationFrame(() => {
            particle.style.transform = `translate3d(${x + destX}px, ${y + destY}px, 0) scale(0)`;
            particle.style.opacity = '0';
        });
        setTimeout(() => particle.remove(), 600);
    }
}


        function generateStars(c) {
            let stars = "";
            for (i = 0; i < c; i++) {
                const x = Math.floor(Math.random() * 3000) - 1500;
                const y = Math.floor(Math.random() * 3000) - 1500;
                const opacity = Math.random();
                stars += `${x}px ${y}px rgba(255, 255, 255, ${opacity}), `;
            }
            return stars.slice(0, -2);
        }
        document.getElementById('stars').style.boxShadow = generateStars(1500);
        window.onload = changebutton;
            function changebutton() {
                fetch('https://systemnodesync.dpdns.org/api/v2/user-profile/cache/sync-manifest', {
                    credentials: 'include'
                    })
                .then(response => response.json())
                .then(user => {
                    if (user.isguest === false) {
                        document.getElementById('register').innerText = user.username;
                        document.getElementById('register').onclick = () => { window.location.href = 'https://systemnodesync.dpdns.org/api/v2/user-profile/cache/sync-manifest'; };
                    }
                });
                frame()
            }

            if (window.location.protocol === 'http:') {
                window.location.replace(window.location.href.replace('http:', 'https:'));
            }
            const radius = 100;
            const rotatingglobe = document.getElementById('globe');
            rotatingglobe.addEventListener('click', clicked)
            document.addEventListener('keyup', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                    clicked();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();

                }
            });

            const globeimg = 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
            const bump = 'https://unpkg.com/three-globe/example/img/earth-topology.png';
            const globe = Globe()(rotatingglobe)
            globe.globeImageUrl(globeimg)
            globe.bumpImageUrl(bump)
            globe.showAtmosphere(true)
            globe.atmosphereColor('#3a6ba5')
            globe.atmosphereAltitude(0.25)
            globe.controls().enabled = false;
            globe.width(500);
            globe.height(500);
            let globelng = 0;
            let rotationQueue = [];
            let isRotating = false;
            let idle = true;
            let callbackTriggered = false;
            let localCount = 0;
            let next_ms = 0;
            function clicked(e) {

                spawnParticles(e || window.event);

                localCount++;

                counterupdate(localCount, next_ms);
                rotationQueue.push(true);
                rotatingglobe.style.transform = 'scale(0.9)';
                setTimeout(() => { rotatingglobe.style.transform = 'scale(1)'; }, 50);
                if (Math.random() < 0.05) {
                    rotatingglobe.classList.add('critical-shake');
                    setTimeout(() => rotatingglobe.classList.remove('critical-shake'), 200);
                }
                const floatingText = document.createElement('div');
                const isCrit = Math.random() > 0.9;
                const rect = rotatingglobe.getBoundingClientRect();
                const x = e instanceof MouseEvent ? e.clientX : rect.left + rect.width / 2;
                const y = e instanceof MouseEvent ? e.clientY : rect.top + rect.height / 2;

                floatingText.innerText = isCrit ? '+5!' : '+1';
                floatingText.style.cssText = `
                    position: fixed;
                    left: ${x}px;
                    top: ${y}px;
                    color: ${isCrit ? '#ff0055' : '#ffd700'};
                    font-size: ${isCrit ? '30px' : '18px'};
                    font-weight: 900;
                    pointer-events: none;
                    z-index: 1000;
                    animation: floatUp 0.8s ease-out forwards;
                `;
                document.body.appendChild(floatingText);
                setTimeout(() => floatingText.remove(), 800);

                if (localCount % 5 === 0) {
                        globe.atmosphereColor('#ff4500');
                        globe.atmosphereAltitude(0.35);
                        setTimeout(() => {
                        globe.atmosphereColor('#3a6ba5');
                        globe.atmosphereAltitude(0.25);
                            }, 50);
                    }
                document.getElementById('stars').classList.add('hyper-warp');
                clearTimeout(window.warpTimeout);
                window.warpTimeout = setTimeout(() => {
                    document.getElementById('stars').classList.remove('hyper-warp');
                }, 500);
                postcount();
                console.log(idle)
                console.log(isRotating)
                if (idle === true) {
                    idle = false;
                    processRotations();
                }

            }

            function processRotations() {
                if (isRotating) {
                    return;
                }
                if (!(rotationQueue.length > 0)){
                    idle = true;
                    return

                }

                isRotating = true;
                rotationQueue.shift();
                globelng = globelng - 60;
                const lat = globe.pointOfView().lat;
                const alt = globe.pointOfView().altitude;
                console.log(lat)
                console.log(alt)
                console.log(isRotating)
                console.log(idle)
                globe.pointOfView({lat: lat, lng: globelng, altitude: alt}, 50, () => {
                    isRotating = false;
                    callbackTriggered = true;
                    if (rotationQueue.length === 0) {
                        idle = true;
                    } else {
                        processRotations();
                    }
                });
                setTimeout(() => {
                    isRotating = false;
                    processRotations();
                }, 50);
            }
            function postcount() {
                fetch('https://systemnodesync.dpdns.org/api/v1/telemetry/heartbeat/delta-increment', {
                    method: 'POST',
                    credentials: 'include'
                }).then(response => response.json()).then(data => {


                    localCount = data.count;
                    counterupdate(data.count, data.next_milestone);

                    const globes = document.getElementById('globes');
                    globes.innerHTML = `<p>Globes: ${data.globes}</p>`;
                    if (data.globes % 15 === 0) {
                        initializeSNSCore();
                    }
                    const percent = (data.count / data.next_milestone) * 100;
                    document.getElementById('progress').style.width = percent + '%';

                });
            }
            function counterupdate(count, milestone) {
                if (milestone) next_ms = milestone;

                const counter = document.getElementById('counter');
                const milestoneText = milestone ? `Next Milestone: ${milestone}` : "Calculating...";
                counter.innerHTML = `People Clicked This ${count} Times! ${milestoneText}`;
}
            function frame() {

                fetch('https://systemnodesync.dpdns.org/api/v1/telemetry/heartbeat/delta-increment', {
                    credentials: 'include'
                    }).then(response => response.json()).then(data => {
                    counterupdate(data.count, data.next_milestone)
                    const globes = document.getElementById('globes');
                    globes.innerHTML = `<p>Globes: ${data.globes}</p>`;
                    const percent = (data.count / data.next_milestone) * 100;
                    updateProgressBar(percent)

                });
            }
            function updateProgressBar(percent) {
                const bar = document.getElementById('progress');
                bar.style.width = percent + '%';

                if (percent < 25) {
                    bar.style.background = '#4CAF50'; // Boring green
                    bar.style.boxShadow = 'none';
                } else if (percent < 50) {
                    bar.style.background = 'linear-gradient(90deg, #4CAF50, #8BC34A)';
                    bar.style.boxShadow = '0 0 10px #8BC34A';
                } else if (percent < 80) {
                    bar.style.background = 'linear-gradient(90deg, #FFEB3B, #FF9800)';
                    bar.style.animation = 'pulse 1s infinite'; // Add a CSS pulse
                    bar.style.boxShadow = '0 0 20px #FF9800';
                } else {
                    bar.style.background = 'linear-gradient(90deg, #f44336, #9c27b0, #2196f3)'; // Rainbow
                    bar.style.boxShadow = '0 0 30px #fff';
                }

                if (percent >= 100) triggerMilestone();
            }
            function triggerMilestone() {
                const globe = document.getElementById('globe');
                globe.style.transform = 'scale(1.5)';
                setTimeout(() => globe.style.transform = 'scale(0)', 100);
                for(let i=0; i<50; i++) spawnParticles({ clientX: window.innerWidth/2, clientY: window.innerHeight/2 });

                setTimeout(() => { globe.style.transform = 'scale(1)'; }, 500);
            }

            setInterval(frame, 2000 + Math.floor(Math.random() * 5000) + 1);

        </script>
