<!DOCTYPE html>
<html>
<head>
    <title>Inventory!</title>
    <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">
    <script src="/static/DragDropTouch.js"></script>

    <style>
        #inv-grid {

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            padding: 20px;
            margin-left: 240px;
            margin-right: 300px;
            height: auto;
            max-height: none;
            overflow-y: auto;
        }
        .item {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .swatch {
            border: 2px solid rgba(0,0,0,0.6);
            transition: transform 0.1s;
            cursor: grab;
            background-color: currentColor;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            touch-action: none;
            -webkit-user-drag: element;
            -webkit-touch-callout: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .swatch:hover { transform: scale(1.1); }

        .ct {
        position: absolute;
        background: white;
        color: black;
        font-size: 8px;
        padding: 1px 4px;
        border: 1px solid #000;
        border-radius: 4px;
        pointer-events: none;
        }
        .rarity-ct { top: -5px; left: -5px; }
        .amount-ct { bottom: -5px; right: -5px; }

            #navbar {
                width: 200px;
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 40px;
                left: 20px;
                gap: 10px;
                padding: 0;
            }

    .btn {
        width: 100%;
        padding: 12px;
        background-color: #9db1b3;
        color: black;
        font-size: 18px;
        border-radius: 10px;
        border: 4px solid gray;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        cursor: pointer;
        box-sizing: border-box;
    }
    .swatch:active {
        cursor: grabbing;
        transform: scale(0.95);
    }.zone-container {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.05);
    padding: 15px;
    border-radius: 20px;
    backdrop-filter: blur(5px);
}

#dropzone, #sellzone, #imagezone {
    width: 160px;
    height: 160px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 14px;
    font-weight: bold;
    padding: 10px;
    box-sizing: border-box;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: default;
}


#dropzone { border: 3px dashed #333; background: rgba(255, 255, 255, 0.3); }
#sellzone { border: 3px dashed #ff4444; background: rgba(255, 68, 68, 0.1); color: #8b0000; }
#imagezone { border: 3px dashed #007bff; background: rgba(0, 123, 255, 0.1); color: #004085; }


#dropzone:hover, #sellzone:hover, #imagezone:hover {
    transform: scale(1.05);
    background: rgba(255, 255, 255, 0.5);
}
    @keyframes breathe {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}
#globecount {
    position: fixed;
    top: 20px;
    right: 20px;
}

        </style>
</head>

<body><div id="navbar">
    <button class='btn' id='register' onclick="window.location.href='/sys/auth/provisioning/node-enrollment'"><strong>Register!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/session/sync/view-instance.html'"><strong>Chat!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/system-diagnostics'"><strong>Click!</strong></button>
    <button class='btn' onclick='window.location.href = "/sys/local-storage/mount-points/registry"'><strong>Inventory!</strong></button>
    <button class='btn' onclick="window.location.href='/internal/assets/resource-catalog/deployment-manifest'"><strong>Shop!</strong></button>
    </div>

    <div id="inv-grid"></div>
    <div class="zone-container">
    <div id="dropzone">
    Drag Color To Equip
    </div>
    <div id="sellzone">
        Drag Color <br> To SELL
    </div>
    <div id="imagezone">
    Drag Image To Equip
</div>
</div>
    <img style="position: fixed;
    top: 20px;
    right: 25px;" src="/static/download-removebg-preview.png"><div id="globecount"></div>
    <script>
    let dragging = false;
    let justEquipped = false;
    if (window.DragDropTouch) {
        DragDropTouch._data.pressHoldDelayMS = 5;
    }
    window.onload = changebutton;
    function changebutton() {
                fetch('/api/v2/user-profile/cache/sync-manifest')
                .then(response => response.json())
                .then(user => {
                    if (user.isguest === false) {
                        document.getElementById('register').innerText = user.username;
                        document.getElementById('register').onclick = () => { window.location.href = '/api/v2/user-profile/cache/sync-manifest'; };
                    }

                    document.getElementById('globecount').innerText = user.globes;
                    get_inv();
                });
            }
    function updateglobes() {
        fetch('/api/v2/user-profile/cache/sync-manifest')
            .then(response => response.json())
            .then(user => {
                document.getElementById('globecount').innerText = user.globes;
            });

        }

    document.addEventListener('dragstart', (e) => {
       if (e.target.classList.contains('swatch')) {
            dragging = true;
            e.dataTransfer.setData("text/plain", e.target.dataset.name)
            const style = window.getComputedStyle(e.target);
            const isImage = style.backgroundImage !== "none";
            let content = isImage ? style.backgroundImage : style.backgroundColor;
            e.dataTransfer.setData("visual", content);

       }

    });
    document.addEventListener("dragover", (e) => {
        e.preventDefault();

    });
    document.addEventListener('dragend', () => {
        dragging = false;

    });
    document.addEventListener('drop', (e) => {

        e.preventDefault();
        dragging = false;

        const dropZone = document.getElementById("dropzone");
        const sellZone = document.getElementById("sellzone");
        const imageZone = document.getElementById("imagezone");
        const isSellz = e.target.closest('#sellzone') !== null;
        const isDropz = e.target.closest('#dropzone') !== null;
        const isImagez = e.target.closest('#imagezone') !== null;

        const name = e.dataTransfer.getData("text/plain");
        const visual = e.dataTransfer.getData("visual");
        const isImage = visual.includes("url(");
        if (isSellz) {

            fetch('/api/v1/assets/liquidation/deprovision-resource', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_name: name })
            }).then(response => response.json()).then((data) => {
                sellZone.innerText = data.message;
                get_inv();
            })
            get_inv();
            updateglobes();
            setTimeout(() => { sellZone.innerHTML = "Drag Color Here <br> To SELL";}, 2000);

        } else if (isDropz) {
            if (isImage) {
                alert("Colors Only! Drag Color To Equip");
                return;
            }
            fetch('/sys/env/runtime/ui-configuration/set-preference', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_name: name })
            })

            dropZone.style.background = visual;
            document.body.style.background = visual;
            dropZone.style.webkitTextStroke = "2px black";
            dropZone.style.paintOrder = "stroke fill";
            dropZone.style.color = "white";
            dropZone.innerText = `Equipped: ${name}`;
            dropZone.style.color = "#fff";
            justEquipped = true;
            setTimeout(() => { justEquipped = false; }, 1000)

        } else if (isImagez) {
            if (!isImage) {
                alert("Images Only! Drag Image To Equip");
                return;
            }
            fetch('/sys/env/runtime/ui-configuration/set-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_name: name })
            })
            imageZone.style.background = "none";
            imageZone.style.backgroundImage = visual;
            imageZone.style.backgroundSize = "cover";
            imageZone.style.backgroundPosition = "center";

            imageZone.innerText = "";
            justEquipped = true;
            setTimeout(() => { justEquipped = false; }, 1000)
        }
    });
    function equipItem(name, color) {
        fetch('/sys/env/runtime/ui-configuration/set-preference', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_name: name })
        });

        const dropZone = document.getElementById("dropzone");
        dropZone.style.background = color;
        document.body.style.background = color;
        dropZone.innerText = `Equipped: ${name}`;
        justEquipped = true;
        setTimeout(() => { justEquipped = false; }, 2000);
    }
    function get_inv() {

        if (dragging || justEquipped) return;
        fetch('/api/v3/user-profile/cache/sync-manifest?t=' + Date.now())
        .then(response => response.json())
        .then(data => {
            const dz = document.getElementById("dropzone");


            if (data.equipped_info && dz) {
                let eqs = data.equipped_info;
                if (eqs === "TRIGGER:rainbow;") {
                    eqs = "linear-gradient(to right, red, orange, yellow, green, blue, violet)";
            }


            document.body.style.background = eqs;
            document.body.style.backgroundClip = "border-box";
            document.body.style.webkitBackgroundClip = "border-box";


            dz.style.background = eqs;
            dz.style.backgroundClip = "border-box";
            dz.innerText = `Equipped: ${data.equipped_item}`;
            dz.style.webkitTextStroke = "2px black";
            dz.style.color = "white";
            }


            const ctn = document.getElementById('inv-grid');
            if (ctn && data.items) {
                const sortedItems = data.items.sort((a, b) => {
                    const ta = a.itemtype === 'color' ? 1 : 2;
                    const tb = b.itemtype === 'color' ? 1 : 2;

    if (ta !== tb) {
        return ta - tb;
    }
    return a.weight - b.weight;
});
                    ctn.innerHTML = sortedItems.map(item =>
                {
                let content = "";
                let style = item.info;
                const isImage = style.includes("url(");
                if (item.name === "Deep_Sea" || item.info.includes("breathe")) {
                    style = "color: #000080; background-color: #000080; font-weight: 800;";
                    content = 'AAAA';
                } else if (item.info === "TRIGGER:rainbow;") {
                    style = "background: linear-gradient(to right, red, orange, yellow, green, blue, violet);";
                }

                else if (style.includes("text-stroke") || style.includes("text-shadow") || style.includes("clip: text")) {
                    content = 'AAAA';
                    style += " background-clip: border-box !important; -webkit-background-clip: border-box !important;";
                }
                return `
    <div class="item">
        <div class="swatch"
             draggable="true"
             data-name="${item.name}"
             onclick="equipItem('${item.name}', \`${style}\` )"
             style="${style}; width: 50px; height: 50px; border-radius: ${isImage ? '50%' : '12px'}; cursor: grab; border: 1px solid rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none;">
             <span style="pointer-events: none;">${content}</span>
        </div>
        <div class="ct rarity-ct">T${item.rarity}</div>
        <div class="ct amount-ct">${item.count}</div>
    </div>`;}).join('');

            }
        });
    }
    </script>
</body>
</html>
