    #red { background-color: #FF0000; }

    <body>

    <h1>SHOP!</h1>

    <div id="packages">
        <div id="globes">
            <p>Globes:
                <span id="globecount">loading...</span>
                <img src="/static/download-removebg-preview.png" width='30px' height='30px'>
            </p>
        </div>

        <div class="package-container">
            <div class="previewbox">
                <p class="pack-header">Color Pack
                    <button class="rates-btn" onclick="viewitemrates('color')">View Rates</button>
                </p>
                <div id="red" class="innerbox"></div>

            </div>
            <button id="btn-color" class="buybtn" onclick="purchase('color')">Buy for <span id="price-color"></span> globes</button>
        </div>
        <div class="package-container">
            <div class="previewbox">
                <p class="pack-header">
                    Shape Pack
                    <button class="rates-btn" onclick="viewitemrates('shape')">View Rates</button>
                </p>
                <div class="innerbox" style="background-image: url('https://hqhhjiudsbvicwaamvbg.supabase.co/storage/v1/object/public/Shapes/Tesseract.webp');"></div>
                <div class="innerbox" style="background-image: url('https://hqhhjiudsbvicwaamvbg.supabase.co/storage/v1/object/public/Shapes/Torus.webp');"></div>
                <div class="innerbox" style="background-image: url('https://hqhhjiudsbvicwaamvbg.supabase.co/storage/v1/object/public/Shapes/Cube.jpeg');"></div>
                <div class="innerbox" style="background-image: url('https://hqhhjiudsbvicwaamvbg.supabase.co/storage/v1/object/public/Shapes/Circle.jpeg');"></div>

            </div>
        <button id="btn-shape" class="buybtn" onclick="purchase('shape')">
            Buy for <span id="price-shape">1000</span> globes
        </button>
        </div>
        <div class="package-container">
            <div class="previewbox">
                <p class="pack-header">
                    Element Pack
                    <button class="rates-btn" onclick="viewitemrates('element')">View Rates</button>
                </p>
                <div class="innerbox" style="background-image:ps://hqhhjiudsbvicwaamvbg.supabase.co/storage/v1/object/public/Shapes/Tesseract.webp');"></div>
                <div class="innerbox" style="background-image: url('https://hqhhiudsbvicwaamvbg.supabase.co/storage/v1/object/public/Shapes/Torus.webp');"></div>
                <div class="innerbox" style="background-image: url('httse.co/storage/v1/object/public/Shapes/Cube.jpeg');"></div>
                <div class="innerbox" style="background-image: url('httpamvbg.supabase.co/storage/v1/object/public/Shapes/Circle.jpeg');"></div>

            </div>
        <button id="btn-shape" class="buybtn" onclick="purchase('element')">
            Buy for <span id="price-element">900</span> globes
        </button>

        <span class="buybtn" id="pending">0 items loading...</span>

    </div>
    <div id="status-container">
        <div id="status"></div>
    </div>

    <script>

    let pendingPurchases = 0;
    let syncTimeout;
    const PACK_CONFIG = {
        'color': {'base_price': 150, 'scaling': 1.02, 'item_type': 'color'},
        'shape':  {'base_price': 1000, 'scaling': 1.0, 'item_type': 'shape'},
        'element':  {'base_price': 900, 'scaling': 1.0, 'item_type': 'element'},

    }
    window.onload = function() {

        fetch('/api/v2/user-profile/cache/sync-manifest').then(res => res.json()).then(user => {
            if (!user.isguest) {
                document.getElementById('register').innerText = user.username;
                document.getElementById('register').onclick = () => { window.location.href = '/api/v2/user-profile/cache/sync-manifest'; };
            }
            document.getElementById('globecount').innerText = user.globes;
        });


        Object.keys(PACK_CONFIG).forEach(packId => {
        fetch(`/api/v1/system/scaling/load-coefficient/${packId}`)
            .then(res => res.json())
            .then(data => {
                const pEl = document.getElementById(`price-${packId}`);
                if (pEl) pEl.innerText = data.price;
            });
    });
}



        function updateglobes() {
            if (pendingPurchases > 0) return;
            fetch('/api/v2/user-profile/cache/sync-manifest')
                .then(response => response.json())
                .then(user => {
                    document.getElementById('globecount').innerText = user.globes;
                });

            }
async function viewitemrates(packType) {
    try {

        const response = await fetch(`/api/v1/metadata/schema/pack-descriptors/${packType}`);
        const items = await response.json();

        if (!items || items.length === 0) {
            alert("No rate data available for this pack.");
            return;
        }


        const totalWeight = items.reduce((sum, item) => sum + (item.weight || 0), 0);


        const output = items
            .map(item => {
                const percent = ((item.weight / totalWeight) * 100);
                return {
                    percent: percent,
                    text: `${item.name.replace('_', ' ')}: ${percent.toFixed(2)}%`
                };
            })
            .sort((a, b) => b.percent - a.percent)
            .map(line => line.text)
            .join("\n");

        alert(`${packType.toUpperCase()} PACK RATES:\n\n${output}`);
    } catch (error) {
        console.error("Error fetching rates:", error);
        alert("Failed to load rates. Please try again.");
    }
}



    function purchase(packId) {
        let gElement = document.getElementById('globecount');
        let pElement = document.getElementById(`price-${packId}`);
        let btn = document.getElementById(`btn-${packId}`);
        let g = parseInt(gElement.innerText);
        let price = parseInt(pElement.innerText);
        let config = PACK_CONFIG[packId];
        if (g >= price) {
            gElement.innerText = g - price;

            let newp = Math.floor(price * config.scaling);
            pElement.innerText = newp
            btn.innerHTML = `buy for <span id="price-${packId}">${newp}</span> globes`;
            document.getElementById('pending').innerHTML = `${pendingPurchases + 1} items loading... refrain from purchasing for the next few seconds to finish.`;
            pendingPurchases++;
            clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => syncPurchases(packId), 800);
        } else {
            alert("Not enough globes!");
        }
    }
        function syncPurchases(packId) {
            if (pendingPurchases === 0) return;
            const amountToSync = pendingPurchases;
            pendingPurchases = 0;
            fetch(`/api/v1/transactional/resource-allocation/commit/${packId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ batch_count: amountToSync})
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "Success") {
                    document.getElementById(`btn-${packId}`).innerHTML = `Buy for <span id="price-${packId}">${data.price}</span> globes`;
                    document.getElementById('globecount').innerText = data.new_balance;
                    handleVisuals(data.items_won);

        }
    });
}
function handleVisuals(items) {
    let i = 0;
    let list = document.getElementById('status');
    let container = document.getElementById('status-container');

    let loop = setInterval(() => {
        let item = items[i];
        let entry = document.createElement('div');


        if (item.info === "TRIGGER:rainbow;") {
            entry.className = "rainbow";
            entry.innerText = "You Won " + item.name;
        } else {
            entry.innerText = "You Won " + item.name;

            entry.style.cssText = item.info;
        }


        entry.style.padding = "5px";
        entry.style.borderBottom = "1px solid rgba(0,0,0,0.05)";
        document.getElementById('pending').innerHTML = `${items.length - 1 - i} items loading... refrain from purchasing for the next few seconds to finish.`;

        list.appendChild(entry);


        container.scrollTop = container.scrollHeight;

        i++;
        if (i >= items.length) {
            clearInterval(loop);
        }
    }, 180);
}


    </script>
