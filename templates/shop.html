<!DOCTYPE html>
<html>
    <head>
        <title>Shop!</title>
        <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

        <style>

        @keyframes rainbow-flash {
            0% { color: #800080; }
            10%   { color: #ff0000; }
            25%  { color: #ff8000; }
            30%  { color: #ffff00; }
            40%  { color: #00ff00; }
            65%  { color: #0000ff; }
            80% { color: #ff0000; }
            100% { color: #800080; }
        }
        .rainbow {
            animation: rainbow-flash 3s infinite linear;
            font-weight: bold;
            color: inherit;
        }
        body {
            background-image: linear-gradient(to bottom, #FFFBF5, #FFEDE6, #FFDCD2);
            height: 100vh;
            overflow: hidden;
        }
        #packages {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            margin-left: 240px;
            gap: 10px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            height: 63vh;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow:
            0 10px 40px rgba(255, 160, 122, 0.2),
            inset 0 0 15px rgba(255, 255, 255, 0.2);
            color: #333;
        }

        h1 {
            text-align: center;
            background: linear-gradient(to right, #4A3B37, #FF8C69, #E9967A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: "Montserrat", "Quicksand";
            font-weight: 700;
            font-weight: 800;
            font-size: 3.0rem;
            letter-spacing: 3px;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        #buycolors {

            border: 1px solid rgba(255, 255, 255, 0.9);
            outline: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 2px 10px;
            cursor: pointer;
            margin-top: 0px;
            width: 180px;
            font-family: "Quicksand", sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: #4A3B37;
            text-transform: uppercase;
            height: 30px;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow:
            0 8px 25px rgba(255, 160, 122, 0.5),
            inset 0 1px 3px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease-in-out;
            position: relative;
    }
    #globes {
        position: fixed;
        top: 0px;
        right: 20px;
        background: transparent;
        font-family: "Montserrat", "Quicksand";
        font-weight: 700;
        font-weight: 800;
        font-size: 2.0rem;
        letter-spacing: 3px;
        margin-top: 0px;
        margin-bottom: 5px;
    }

    #colors-header {
        grid-column: span 2;
        margin: 0;
        text-align: center;
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        color: #4A3B37;
        margin-bottom: 5px;
    }
    #buycolors:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow:
        0 4px 15px rgba(255, 255, 255, 0.5),
        0 8px 20px rgba(255, 160, 122, 0.2);
    }


    #buycolors:active {
        transform: translateY(1px);
        box-shadow: 0 4px 15px rgba(255, 160, 122, 0.4);
    }
    #colorsbox {

        width: 180px;
        height: 210px;
        margin: 0;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(5px);
        box-sizing: border-box;
        border-radius: 15px;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3),
                0 4px 10px rgba(0, 0, 0, 0.2);
        display: grid;

        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 8px;
        padding: 20px;
        overflow: hidden;
        justify-content: center;
        align-content: center;
    }
    #colorratesbutton {
        background: rgba(253, 94, 83, 0.4);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.6rem;
        cursor: pointer;
        margin-left: 5px;
        padding: 2px 6px;
        width, height: 1.5em;
    }
    .innerbox {
        width: 65px;
        margin: 0;
        height: 65px;
        border-radius: 15%;
        border: 2px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
        cursor: pointer;
    }

    #red { background-color: #FF0000; }
    #orange { background-color: #FFA500; }
    #blue { background-color: #1DA6E0; }
    #green { background-color: #1DE068; }
       #navbar {
                width: 200px;
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 40px;
                left: 20px;
                gap: 10px;
                padding: 0;
            }

    .btn {
        width: 100%;
        padding: 12px;
        background-color: #9db1b3;
        color: black;
        font-size: 18px;
        border-radius: 10px;
        border: 4px solid gray;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        cursor: pointer;
        box-sizing: border-box;
    }
        </style>
    </head>
    <body>
         <div id="navbar">
    <button class='btn' id='register' onclick="window.location.href='/sys/auth/provisioning/node-enrollment'"><strong>Register!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/observer-instance.html'"><strong>Chat!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/system-diagnostics'"><strong>Click!</strong></button>
    <button class='btn' onclick='window.location.href = "/sys/local-storage/mount-points/registry"'><strong>Inventory!</strong></button>
    <button class='btn' onclick="window.location.href='/internal/assets/resource-catalog/deployment-manifest'"><strong>Shop!</strong></button>
    </div>
        <h1>SHOP!</h1>

        <div id="packages">
            <div id="globes">
            <p>Globes: <span id="globecount">loading...</span><img src="/static/download-removebg-preview.png" width='30px' height='30px'></p>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
            <div id="colorsbox">
                <p id="colors-header">Color Pack<button id="colorratesbutton" onclick="viewcolorrates()">View Rates</button></p>
        <div id="red" class="innerbox"></div>
        <div id="orange" class="innerbox"></div>
        <div id="blue" class="innerbox"></div>
        <div id="green" class="innerbox"></div></div>
            <button id="buycolors" onclick="purchase()">Buy for <span id="price"></span> globes</button>
            <div id="status-container" style="display: flex; flex-direction: column-reverse; overflow-y: auto; max-height: 150px; margin-top: 10px; font-family: 'Quicksand'; font-size: 0.9rem;">
    <div id="status"></div>
</div></div>
            <div id="colorsbox"><p id="colors-header">Coming<br>Soon!</p></div>
        </div>
    <script>
    let pendingPurchases = 0;
    let syncTimeout;
    window.onload = function() {

    fetch('/api/v2/user-profile/cache/sync-manifest').then(res => res.json()).then(user => {
        if (!user.isguest) {
            document.getElementById('register').innerText = user.username;
            document.getElementById('register').onclick = () => { window.location.href = '/api/v2/user-profile/cache/sync-manifest'; };
        }
        document.getElementById('globecount').innerText = user.globes;
    });


    fetch('/api/v1/system/scaling/load-coefficient').then(res => res.json()).then(data => {
        document.getElementById('price').innerText = data.price;
    });
};;


        function updateglobes() {
            fetch('/api/v2/user-profile/cache/sync-manifest')
                .then(response => response.json())
                .then(user => {
                    document.getElementById('globecount').innerText = user.globes;
                });

            }
        function viewcolorrates() {
            let items = [];
            let count = 0;
            for (let i = 1; i <= 19; i++) {
                fetch(`/api/v1/metadata/schema/object-descriptor/${i}`).then(response => response.json()).then(data => {
                    let p = (data.weight/78251) * 100
                    items.push([p, `${data.name}: ${p.toFixed(4)}%`]);
                    count++;
                    if (count === 19) {
                        alert("All Color Rates:\n" + items.sort((a, b) => b[0] - a[0]).map(m => m[1]).join("\n"));
                    }

                })

        }
    }


        function purchase() {
            let g = parseInt(document.getElementById('globecount').innerText);
            let price = parseInt(document.getElementById('price').innerText);
            if (g >= price) {
                document.getElementById('globecount').innerText = currentGlobes - pricePerItem;
                document.getElementById('status').innerText = "Queuing... Stop clicking to sync";
                pendingPurchases++;
                clearTimeout(syncTimeout);
                syncTimeout = setTimeout(syncPurchases, 1500);
            } else {
                document.getElementById('status').innerText = "Not enough globes!";
            }
        function syncPurchases() {
            if (pendingPurchases === 0) return;

            fetch('/api/v1/transactional/resource-allocation/commit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ batch_count: pendingPurchases })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "Success") {
                    document.getElementById('globecount').innerText = data.new_balance;
                    document.getElementById('price').innerText = data.price;
                    handleVisuals(data.items_won);
                    pendingPurchases = 0;
        }
    });
}
function handleVisuals(items) {
    let i = 0;
    let list = document.getElementById('status');
    let loop = setInterval(() => {
        let item = items[i];
        let entry = document.createElement('div');
        entry.innerText = " + " + item.name;

        entry.style.cssText = item.info + "; margin-bottom: 5px; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 2px;";
        list.prepend(entry);
        i++;
        if (i >= items.length) {
            clearInterval(loop);
        }
    }, 200);
}
        setInterval(updateglobes, 7500);

    </script>
    </body>
</html>
