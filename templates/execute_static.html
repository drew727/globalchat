<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supabase SQL Mirror Console</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; margin: 20px; }
        .console-container { border: 1px solid #30363d; border-radius: 6px; display: flex; flex-direction: column; height: 80vh; background: #161b22; }
        .header { padding: 10px; border-bottom: 1px solid #30363d; display: flex; gap: 10px; align-items: center; }
        #api-key-input { background: #0d1117; border: 1px solid #30363d; color: #58a6ff; padding: 5px; flex-grow: 1; border-radius: 4px; }

        #results-display { flex-grow: 1; padding: 15px; overflow-y: auto; white-space: pre-wrap; font-size: 14px; border-bottom: 1px solid #30363d; }
        .input-area { display: flex; background: #0d1117; padding: 10px; }
        .prompt { color: #238636; margin-right: 10px; font-weight: bold; }
        #sql-input { background: transparent; border: none; color: #c9d1d9; flex-grow: 1; outline: none; font-family: inherit; font-size: 14px; }

        .error { color: #f85149; }
        .success { color: #3fb950; }
        .info { color: #8b949e; border-bottom: 1px solid #30363d; margin-bottom: 10px; padding-bottom: 5px; }
    </style>
</head>
<body>

    <h2>Mirror Console</h2>

    <div class="console-container">
        <div class="header">
            <span>Key:</span>
            <input type="password" id="api-key-input" placeholder="Enter X-API-KEY here...">
        </div>

        <div id="results-display">-- Connected to Supabase Mirror --
Type your SQL command below and press Enter.</div>

        <div class="input-area">
            <span class="prompt">sql></span>
            <input type="text" id="sql-input" placeholder="SELECT * FROM table;" autocomplete="off">
        </div>
    </div>

    <script>
        const sqlInput = document.getElementById('sql-input');
        const resultsDisplay = document.getElementById('results-display');
        const apiKeyInput = document.getElementById('api-key-input');

        sqlInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const query = sqlInput.value.trim();
                if (!query) return;

                // Display the command in the "log"
                appendLog(`> ${query}`, 'info');
                sqlInput.value = '';

                try {
                    const response = await fetch('https://systemnodesync.dpdns.org/api/v1/system/sql/execute', {
                        method: 'POST',
                        credentials: 'include,'
                        headers: {
                            'Content-Type': 'application/json',
                            'X-API-KEY': apiKeyInput.value
                        },
                        body: JSON.stringify({ query: query })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        const dataString = result.data ? JSON.stringify(result.data, null, 2) : result.message;
                        appendLog(dataString, 'success');
                    } else {
                        appendLog(`Error: ${result.message}`, 'error');
                    }
                } catch (err) {
                    appendLog(`System Error: ${err.message}`, 'error');
                }
            }
        });

        function appendLog(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            resultsDisplay.appendChild(div);
            resultsDisplay.scrollTop = resultsDisplay.scrollHeight;
        }
    </script>
</body>
</html>
