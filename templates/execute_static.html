<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supabase SQL Mirror Console</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; margin: 20px; }
        .console-container { border: 1px solid #30363d; border-radius: 6px; display: flex; flex-direction: column; height: 85vh; background: #161b22; }

        #results-display { flex-grow: 1; padding: 15px; overflow-y: auto; white-space: pre-wrap; font-size: 14px; border-bottom: 1px solid #30363d; scroll-behavior: smooth; }

        .input-area { display: flex; background: #0d1117; padding: 12px; border-radius: 0 0 6px 6px; }
        .prompt { color: #238636; margin-right: 10px; font-weight: bold; user-select: none; }
        #sql-input { background: transparent; border: none; color: #c9d1d9; flex-grow: 1; outline: none; font-family: inherit; font-size: 14px; }

        .error { color: #f85149; margin-bottom: 8px; }
        .success { color: #3fb950; margin-bottom: 8px; }
        .info { color: #58a6ff; border-bottom: 1px solid #30363d; margin-top: 10px; margin-bottom: 5px; padding-bottom: 2px; }
    </style>
</head>
<body>

    <h2>Mirror Console (Debug Mode)</h2>

    <div class="console-container">
        <div id="results-display">-- Connected to Supabase Mirror --
-- API Key Disabled --
Type your SQL command below and press Enter.</div>

        <div class="input-area">
            <span class="prompt">sql></span>
            <input type="text" id="sql-input" placeholder="SELECT * FROM your_table LIMIT 5;" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const sqlInput = document.getElementById('sql-input');
        const resultsDisplay = document.getElementById('results-display');

        sqlInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const query = sqlInput.value.trim();
                if (!query) return;

                // Log the outgoing command
                appendLog(`\n> ${query}`, 'info');
                sqlInput.value = '';

                try {
                    const response = await fetch('https://systemnodesync.dpdns.org/api/v1/system/sql/execute', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ query: query })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        // Check if result.data exists, otherwise use message or stringify the whole result
                        const output = result.data ? JSON.stringify(result.data, null, 2) :
                                      (result.message || JSON.stringify(result, null, 2));
                        appendLog(output, 'success');
                    } else {
                        appendLog(`Error: ${result.message || 'Unknown error'}`, 'error');
                    }
                } catch (err) {
                    appendLog(`Network/System Error: ${err.message}`, 'error');
                }
            }
        });

        function appendLog(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            resultsDisplay.appendChild(div);
            // Auto-scroll to bottom
            resultsDisplay.scrollTop = resultsDisplay.scrollHeight;
        }

        // Keep focus on input if clicking inside console
        document.querySelector('.console-container').addEventListener('click', () => {
            sqlInput.focus();
        });
    </script>
</body>
</html>
