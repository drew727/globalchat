<!DOCTYPE html>
<html>
<head>
    <title>Register!</title>
    <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">
    <style>
            :root {
            --bg-color: #08080a;
            --card-bg: #121217;
            --accent-color: #1da6e0; /* Blue Tier for Register */
            --text-color: #ffffff;
            --input-bg: #1c1c24;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #08080a 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h2 {
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--accent-color);
        }

        #form {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #333;
            width: 100%;
            max-width: 340px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* The Neon Top Border */
        #form::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            box-shadow: 0 0 10px var(--accent-color);
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--input-bg);
            color: white;
            box-sizing: border-box;
            transition: all 0.3s;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--accent-color);
            background: #252533;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        #register {
            background: linear-gradient(135deg, var(--accent-color), #157eb0);
            color: white;
            box-shadow: 0 4px 15px rgba(29, 166, 224, 0.3);
        }

        #register:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #redirect {
            background: transparent;
            color: #666;
            font-size: 0.8rem;
            text-decoration: underline;
            margin-top: 20px;
        }

        #redirect:hover {
            color: var(--accent-color);
        }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ff4d4d;
            font-weight: bold;
            min-height: 1.5rem;
        }
</style>
</head>

<body>
    <div id="form">
    <form id="submit" action=/sys/auth/provisioning/node-enrollment method="POST">
            <input type="text" autocomplete="off" id="username_input" placeholder="Username">
            <input type="password" autocomplete="off" id="password_input" placeholder="Password">
            <input type="password" autocomplete="off" id="confirm_password" placeholder="Confirm Password">
            <button type="button" id='register' onclick='send_register()'>Register</button>

    </form></div>
    <button id='redirect' onclick="window.SNS_ROUTER.rewritePage('login_static');"><em>Already registered? Click to login.</em></button>
    <p id='status'></p>
    <script>

        hideform();
        function authenticateUser() {
            const text = document.getElementById('status')
            text.textContent = "loading";
                try {
                    const response = fetch('https://systemnodesync.dpdns.org/api/v1/auth/headless-init', {
                    credentials: 'include'
                    }).then(response => response.json()).then(data => {
                        console.log("Init Result:", data);
                    })

                } catch (err) {
                    console.error("Init Request Failed:", err);
                    text.textContent = err.message;
                }

            }
        window.onload = authenticateUser;
        function hideform() {
            fetch('https://systemnodesync.dpdns.org/api/v2/user-profile/cache/sync-manifest', {
                    credentials: 'include'
                    })
            .then(response => response.json())
            .then(user => {
                if (user.isguest === false) {
                     document.getElementById('form').style.display = 'none';
                }
            })


        }
        function send_register() {
            const nameinput = document.getElementById('username_input').value;
            const password = document.getElementById('password_input').value;
            const password2 = document.getElementById('confirm_password').value;
            const text = document.getElementById('status')
            if (password !== password2) {
                text.textContent = "Check your spelling, passwords don't match!";
                return;
            }
            fetch('https://systemnodesync.dpdns.org/sys/auth/provisioning/node-enrollment', {
                method: 'POST',
                credentials: 'include',
                body: `username=${encodeURIComponent(nameinput)}&password=${encodeURIComponent(password)}`,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'}})
                .then(response => response.json()).then(data => {
                        if (data.status === "success"){
                            text.textContent = "User registered, redirecting to home page";
                            hideform();
                            setTimeout(() => {window.SNS_ROUTER.rewritePage('chat_static');}, 1000)
                        } else {
                            text.textContent = data.status;
                        }
                    });
        }
    </script>
</body>
</html>
