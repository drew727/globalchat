    <!DOCTYPE html>
    <html>
    <head>
        <title>Home</title>
        <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">
        <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
        <meta name="description" content="Technical documentation for SNS Core Architecture. This portal manages high-availability state synchronization, cryptographic handshaking, and managed service discovery protocols for node clusters. Detailed schemas for API v1 internal telemetry and reconciliation-buffer diagnostics are included for authorized node administrators.">

        <script type="application/ld+json">
            {
         "@context": "https://schema.org",
          "@type": "TechArticle",
          "name": "SNS Node Infrastructure and Reconciliation Layer v2.1",
        "description": "System-wide diagnostic report for Distributed Systems Lab.",
        "articleBody": "{{ system_description }}"
        }
</script>

        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
color: #e6edf3;
font-family: 'Segoe UI', Tahoma, sans-serif;
            }

            #chatbox {
                margin: 25px;
                padding: 10px;
                background-color: white;
                border-radius: 10px;
                border: 10px solid #5e9cc4;
                margin-left: 250px;
                min-width: 30vw;
                min-height: 400px;
                max-height: 400px;
                overflow-y: auto;
            }
            p {
                margin: 10px;
                border-radius: 10px;
            }
    @keyframes rainbow-flash {
        0% { color: #800080; }
        10%   { color: #ff0000; }
        25%  { color: #ff8000; }
        30%  { color: #ffff00; }
        40%  { color: #00ff00; }
        65%  { color: #0000ff; }
        80% { color: #ff0000; }
        100% { color: #800080; }
    }
    .rainbow {
        animation: rainbow-flash 3s infinite linear;
        font-weight: bold;
        color: inherit;
    }
            #click-btn {
                width: 200px;
                padding: 10px;
                background-color: #9db1b3;
                position: fixed;
                top: 100px;
                left: 20px;
                color: black;
                font-size: 20px;
                border-radius: 10px;
                border: 4px solid gray;
                box-shadow: 0 2px;
            }
            #submit {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                margin-top: 20px;
            }

            #changelog {
                width: 200px;
                padding: 10px;
                background-color: #9db1b3;
                position: fixed;
                top: 160px;
                left: 20px;
                color: black;
                font-size: 20px;
                border-radius: 10px;
                border: 4px solid gray;
                box-shadow: 0 2px;
            }

            .hidden {
                display: none !important;
            }
            #picker {
                position: absolute;
                bottom: 80px;
                left: 400px;
                z-index: 9999;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
                 }
            #message_text {
                border-radius: 12px;
                border-width: 2px;
                border-color: #46dde8;
                margin-right: 20px;

                background-color: white;
                color: black;
                font-weight: 10px;
                width: 400px;
                height: 30px;
            }
            #send {
                background-color: #69C98C;
                border-radius: 50px;
                height: 40px;
                width: 50px;
            }
            #guest {
                font-weight: 800;
            }
            i {
                font-size: 12px;
                font-stretch: condensed;
            }
            #username::placeholder {
                color: black;
                opacity: 0.5;
                text-align: center;
            }
            #navbar {
                width: 200px;
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 40px;
                left: 20px;
                gap: 10px;
                padding: 0;
            }

    .btn {
        width: 100%;
        padding: 12px;
        background-color: #9db1b3;
        color: black;
        font-size: 18px;
        border-radius: 10px;
        border: 4px solid gray;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        cursor: pointer;
        box-sizing: border-box;
    }
       emoji-picker {
        --num-columns: 6;
        --category-emoji-size: 1.5rem;
        width: 300px;
        height: 400px;
        }

        #emoji-trigger {

            background-color: #69C98C;
            border-radius: 50px;
            height: 40px;
            width: 45px;
            border: 2px solid black;
            padding: 0;
        }
        </style>
    </head>

    <body>
        <div id="chatbox">        </div>
        <form id="submit" onsubmit="event.preventDefault(); sendmessage();">
        <div id="emoji-container" style="display: inline-block; vertical-align: middle;">
            <button type="button" id="emoji-trigger"><center>😀</center></button>

            <emoji-picker id="picker" class="hidden"></emoji-picker>
    </div>


        <input type="text" autocomplete="off" id="message_text" placeholder="Your message"><button type="button" id='send' onclick='sendmessage()'>Send</button></form>
    <div id="navbar">
    <button class='btn' id='register' onclick="window.location.href='/sys/auth/provisioning/node-enrollment'"><strong>Register!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/observer-instance.html'"><strong>Chat!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/system-diagnostics'"><strong>Click!</strong></button>
    <button class='btn' onclick="window.location.href = '/sys/local-storage/mount-points/registry'"><strong>Inventory!</strong></button>
    <button class='btn' onclick="window.location.href='/internal/assets/resource-catalog/deployment-manifest'"><strong>Shop!</strong></button>
    </div><p style="color: #ff8000; text-align: center; font-size: 24px; text-decoration: underline;"><strong>News</strong></p>
        <p style="color: #ff8000; text-align: center; font-size: 18px;"><strong> WE'RE BACK!!!!!!!!!!!!!!!!!!!!!</strong></p>
        <div style="color: #ff8000; text-align: center; font-size: 18px;">
        <strong></strong>
        <ul style="list-style-position: inside; padding: 0; font-weight: bold;">

        </ul>
    </div>
        <script>
            if (window.location.protocol === 'http:') {
                window.location.replace(window.location.href.replace('http:', 'https:'));
            }
            const etrigger = document.querySelector('#emoji-trigger');
            const epicker = document.querySelector('#picker');

            etrigger.addEventListener('click', () => {
                picker.classList.toggle('hidden');
            });


            document.addEventListener('click', (e) => {
                if (!epicker.contains(e.target) && e.target !== etrigger) {
                    epicker.classList.add('hidden');
                }
            });

            document.querySelector('emoji-picker').addEventListener('emoji-click', event => {
                const input = document.getElementById('message_text');
                input.value += event.detail.unicode;
                input.focus();
            });

            window.onload = changebutton;
            function changebutton() {
                fetch('/api/v2/user-profile/cache/sync-manifest')
                .then(response => response.json())
                .then(user => {
                    if (user.isguest === false) {
                        document.getElementById('register').innerText = user.username;
                        document.getElementById('register').onclick = () => { window.location.href = '/api/v2/user-profile/cache/sync-manifest'; };
                    }
                });
                updateMessages()
            }

            updateMessages();

            input = document.getElementById('message_text');
            input.addEventListener('keydown', checkenter);
            function checkenter(event) {
                if (event.key == 'Enter') {
                    event.preventDefault();
                    sendmessage();
                }}
            let isnewmessage = true;
            function sendmessage() {

                const message = document.getElementById('message_text').value;
                if (message == '') {
                    return;
                }
                fetch('/api/v1/internal/transport/buffer/stream-push', {
                    method: 'POST',
                    //username=${encodeURIComponent(username)}&
                    body: `message_text=${encodeURIComponent(message)}&room_id=0`,
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
                }).then(() => {
                    document.getElementById('message_text').value = '';
                    isnewmessage = true
                    updateMessages();
                });


            }
function updateMessages() {
    fetch('/api/v1/internal/transport/buffer/stream-fetch')
        .then(response => response.json())
        .then(messages => {
            const chatbox = document.getElementById('chatbox');
            chatbox.innerHTML = '';

            messages.forEach(msg => {
                let style = msg.colorinfo || "";
                let rainbow = "";
                let displayText = msg.text;


                if (msg.colorinfo === "TRIGGER:rainbow;") {
                    rainbow = "rainbow";
                    style = "";
                }





                chatbox.innerHTML += `
                    <p class="${rainbow}" style="${style}">
                        <i>${new Date(msg.timestamp * 1000).toLocaleTimeString()} </i>
                        <strong id='guest'>${msg.username}</strong>|Tier ${msg.level}|: ${displayText}
                    </p>`;
            });


            if (isnewmessage) {
                isnewmessage = false;
                setTimeout(() => {
                    chatbox.scrollTop = chatbox.scrollHeight;
                }, 50);
            }
        });
}
            (function loop() {

                const rand = Math.round(Math.random() * 15000) + 20000;
                setTimeout(() => {
                updateMessages();
                    loop();
            }, rand);
            }());
        </script>
    </body>
    </html>
