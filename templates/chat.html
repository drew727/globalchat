         "@context": "https://schema.org",

        <style>
            * {
                box-sizing: border-box;
            }
            body {background: radial-gradient(circle at center, #1b3d54 0%, #050a10 80%, #000000 100%);
background-attachment: fixed;
            }

    #chatbox {
        margin: 25px;
        margin-left: 250px;
        padding: 15px;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        border: 2px solid #46dde8;
        box-shadow: 0 0 20px rgba(70, 221, 232, 0.3);
        min-width: 35vw;
        height: 450px;
        overflow-y: auto;
    }

    p {
        margin: 0 0;
        display: inline-flex;
        align-items: center;
        padding: 4px 7px;
        border-left: 3px solid #46dde8;
        background: rgba(255, 255, 255, 0.05);
        font-family: sans-serif;
        font-size: 14px;
        color: #e0e0e0;
        word-wrap: break-word;
        -webkit-font-smoothing: antialiased;
}
@keyframes announcementPulse {
    0% { transform: translateY(-50%) scaleX(0); opacity: 0; }
    10% { transform: translateY(-50%) scaleX(1); opacity: 1; }
    90% { transform: translateY(-50%) scaleX(1); opacity: 1; }
    100% { transform: translateY(-50%) scaleX(0); opacity: 0; }
}
@keyframes flow {
    from { background-position: 0% center; }
    to { background-position: 200% center; }
}
@keyframes breathe {
    0%, 100% {
        color: #000080;
        text-shadow: 0 0 2px rgba(0,0,128,0.3);
    }
    50% {
        color: #0000FF;
        text-shadow: 0 0 8px #46dde8;
    }
}
@keyframes rainbow-flash {
    0%, 100% {
        color: #ff00ea;
        text-shadow: 0 0 4px #ff00ea, 0 0 8px rgba(255, 0, 234, 0.6);
        transform: scale(1.0);
    }
    15% {
        color: #ff0000;
        text-shadow: 0 0 4px #ff0000, 0 0 8px rgba(255, 0, 0, 0.6);
    }
    35% {
        color: #ffcc00;
        text-shadow: 0 0 4px #ffcc00, 0 0 10px rgba(255, 204, 0, 0.7);

    }
    50% {
        color: #ffff00;
        text-shadow: 0 0 4px #ffff00, 0 0 12px rgba(255, 255, 0, 0.8);
        transform: scale(1.02);
    }
    65% {
        color: #00ff00;
        text-shadow: 0 0 4px #00ff00, 0 0 8px rgba(0, 255, 0, 0.6);
    }
    85% {
        color: #088F8F;
        text-shadow: 0 0 4px #088F8F, 0 0 8px rgba(8, 143, 143, 0.6);
    }
    95% {
        color: #6a0dad;
        text-shadow: 0 0 4px #6a0dad, 0 0 8px rgba(106, 13, 173, 0.6);
    }
}

.rainbow {

    font-weight: 900;
    font-size: 1.1em;
    letter-spacing: 1.5px;
    animation: rainbow-flash 3s linear infinite;
    -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.5);
    paint-order: stroke fill;
}

.announcement {

    font-weight: 900;
    font-size: 1.1em;
    letter-spacing: 1.5px;
    animation: announcementPulse 2s linear infinite;
    -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.5);
    paint-order: stroke fill;
}
            #submit {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                margin-top: 20px;
            }


            .hidden {
                display: none !important;
            }
            #picker {
                position: absolute;
                bottom: 80px;
                left: 400px;
                z-index: 9999;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
                 }
            #message_text {
                border-radius: 12px;
                border-width: 2px;

            }

        }

            background-color: #69C98C;

    <body>
        <div id="chatbox">        </div>
        <form id="submit" onsubmit="event.preventDefault(); sendmessage();">
        <div id="emoji-container" style="display: inline-block; vertical-align: middle;">
            <button type="button" id="emoji-trigger"><center>😀</center></button>

            <emoji-picker id="picker" class="hidden"></emoji-picker>
    </div>


        <input type="text" autocomplete="off" id="message_text" placeholder="Your message"><button type="button" id='send' onclick='sendmessage()'>Send</button></form>
    <div id="navbar">
    <button class='btn' id='register' onclick="window.location.href='/sys/auth/provisioning/node-enrollment'"><strong>Register!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/session/sync/view-instance.html'"><strong>Chat!</strong></button>
    <button class='btn' onclick="window.location.href='/api/v1/internal/telemetry/nodes/reconciliation-buffer/system-diagnostics'"><strong>Click!</strong></button>
    <button class='btn' onclick="window.location.href = '/sys/local-storage/mount-points/registry'"><strong>Inventory!</strong></button>
    <button class='btn' onclick="window.location.href='/internal/assets/resource-catalog/deployment-manifest'"><strong>Shop!</strong></button>
    </div><p style="text-align: center; font-size: 24px; text-decoration: underline;"><strong>News</strong></p>
        <p style="text-align: center; font-size: 18px;"><strong> WE'RE BACK!!!!!!!!!!!!!!!!!!!!!</strong></p>
        <div style="color: #ff8000; text-align: center; font-size: 18px;">
        <strong></strong>
        <ul style="list-style-position: inside; padding: 0; font-weight: bold;">

        </ul>
    </div>
        <script>
            if (window.location.protocol === 'http:') {
                window.location.replace(window.location.href.replace('http:', 'https:'));
            }
            let input = document.getElementById('message_text');
            let isFetching = false;
            let lastFetchTime = 0;
            function smartUpdate() {
                const now = Date.now();
                if (isFetching || (now - lastFetchTime < 2000)) return;

                isFetching = true;
                updateMessages();
                lastFetchTime = now;
                isFetching = false;
            }
            input.addEventListener('focus', smartUpdate);
            input.addEventListener('input', smartUpdate);
            const etrigger = document.querySelector('#emoji-trigger');
            const epicker = document.querySelector('#picker');

            etrigger.addEventListener('click', () => {
                picker.classList.toggle('hidden');
            });


            document.addEventListener('click', (e) => {
                if (!epicker.contains(e.target) && e.target !== etrigger) {
                    epicker.classList.add('hidden');
                }
            });

            document.querySelector('emoji-picker').addEventListener('emoji-click', event => {
                input.value += event.detail.unicode;
                input.focus();
            });

            window.onload = changebutton;
            function changebutton() {
                fetch('/api/v2/user-profile/cache/sync-manifest')
                .then(response => response.json())
                .then(user => {
                    if (user.isguest === false) {
                        document.getElementById('register').innerText = user.username;
                        document.getElementById('register').onclick = () => { window.location.href = '/api/v2/user-profile/cache/sync-manifest'; };
                    }
                });
                const chatbox = document.getElementById('chatbox');
                chatbox.scrolltop =  chatbox.scrollHeight;
                updateMessages()
            }



            input = document.getElementById('message_text');
            input.addEventListener('keydown', checkenter);


            function checkenter(event) {
                if (event.key == 'Enter') {
                    event.preventDefault();
                    sendmessage();
                }}

            let isnewmessage = true;
            function sendmessage() {

                const message = document.getElementById('message_text').value;
                if (message == '') {
                    return;
                }
                fetch('/api/v1/internal/transport/buffer/stream-push', {
                    method: 'POST',
                    body: `message_text=${encodeURIComponent(message)}&room_id=0`,
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
                }).then(() => {
                    document.getElementById('message_text').value = '';
                    isnewmessage = true
                    updateMessages();
                    setTimeout(updateMessages, 200);
                });
                setTimeout(() => {
                    chatbox.scrollTo({
                        top: chatbox.scrollHeight,
                        behavior: 'smooth'
                        });
                }, 40);


            }
function updateMessages() {
    fetch('/api/v1/internal/transport/buffer/stream-fetch')
        .then(response => response.json())
        .then(messages => {
            lastFetchTime = Date.now();
            const chatbox = document.getElementById('chatbox');
            chatbox.innerHTML = '';

            messages.forEach(msg => {
                let style = msg.colorinfo || "";
                let rainbow = "";
                let displayText = msg.text;



                if (msg.colorinfo === "TRIGGER:rainbow;") {
                    rainbow = "rainbow";
                    style = "";
                }
                else if (style.includes("breathe")) {

                    style = style.replace(/display:\s?flex;?|align-items:\s?center;?|justify-content:\s?center;?/g, "");
                    style += " color: #000080 !important; opacity: 1 !important; visibility: visible !important;";
                }

                let imgS = "";
                if (msg.imageinfo) {
                    imgS = msg.imageinfo

                }
                if (msg.colorinfo && msg.colorinfo.includes("announcementPulse")) {
                    rainbow = "announcement";
                }
                chatbox.innerHTML += `
                <div class="text-container">
                    <div class="img-box" style="${imgS}"></div><p class="${rainbow}" style="${style}">
                        <i>${new Date(msg.timestamp * 1000).toLocaleTimeString()} </i>
                        <strong id='guest'>${msg.username}</strong>|Tier ${msg.level}|: ${displayText}
                    </p>
                    </div>`;
            });
            if (isnewmessage) {
                isnewmessage = false;
                setTimeout(() => {
                    chatbox.scrollTop = chatbox.scrollHeight;
                }, 30);
            }
        });
}

        (function activityLoop() {
                if (!document.hidden) {
                    smartUpdate();
                }

                const jitter = Math.floor(Math.random() * 30000) + 15000;
                setTimeout(activityLoop, jitter);
            })();


        </script>
    </body>
