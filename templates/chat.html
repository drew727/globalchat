    <!DOCTYPE html>
    <html>
    <head>
        <title>Chat Interface</title>
        <link rel="icon" type="image/png" href="/static/download-removebg-preview.png">
        <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #042c4a;
            }

            #chatbox {
                margin: 25px;
                padding: 10px;
                background-color: white;
                border-radius: 10px;
                border: 10px solid #5e9cc4;
                margin-left: 250px;
                min-width: 30vw;
                min-height: 400px;
                max-height: 400px;
                overflow-y: auto;
            }
            p {
                margin: 10px;
                border-radius: 10px;
            }
    @keyframes rainbow-flash {
        0% { color: #800080; }
        10%   { color: #ff0000; }
        25%  { color: #ff8000; }
        30%  { color: #ffff00; }
        40%  { color: #00ff00; }
        65%  { color: #0000ff; }
        80% { color: #ff0000; }
        100% { color: #800080; }
    }
    .rainbow {
        animation: rainbow-flash 3s infinite linear;
        font-weight: bold;
        color: inherit;
    }
            #click-btn {
                width: 200px;
                padding: 10px;
                background-color: #9db1b3;
                position: fixed;
                top: 100px;
                left: 20px;
                color: black;
                font-size: 20px;
                border-radius: 10px;
                border: 4px solid gray;
                box-shadow: 0 2px;
            }
            #submit {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                margin-top: 20px;
            }

            #changelog {
                width: 200px;
                padding: 10px;
                background-color: #9db1b3;
                position: fixed;
                top: 160px;
                left: 20px;
                color: black;
                font-size: 20px;
                border-radius: 10px;
                border: 4px solid gray;
                box-shadow: 0 2px;
            }

            .hidden {
                display: none !important;
            }
            #picker {
                position: absolute;
                bottom: 80px;
                left: 400px;
                z-index: 9999;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
                 }
            #message_text {
                border-radius: 12px;
                border-width: 2px;
                border-color: #46dde8;
                margin-right: 20px;

                background-color: white;
                color: black;
                font-weight: 10px;
                width: 400px;
                height: 30px;
            }
            #send {
                background-color: #69C98C;
                border-radius: 50px;
                height: 40px;
                width: 50px;
            }
            #guest {
                font-weight: 800;
            }
            i {
                font-size: 12px;
                font-stretch: condensed;
            }
            #username::placeholder {
                color: black;
                opacity: 0.5;
                text-align: center;
            }
            #navbar {
                width: 200px;
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 40px;
                left: 20px;
                gap: 10px;
                padding: 0;
            }

    .btn {
        width: 100%;
        padding: 12px;
        background-color: #9db1b3;
        color: black;
        font-size: 18px;
        border-radius: 10px;
        border: 4px solid gray;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        cursor: pointer;
        box-sizing: border-box;
    }
       emoji-picker {
        --num-columns: 6;
        --category-emoji-size: 1.5rem;
        width: 300px;
        height: 400px;
        }

        #emoji-trigger {

            background-color: #69C98C;
            border-radius: 50px;
            height: 40px;
            width: 45px;
            border: 2px solid black;
            padding: 0;
        }
        </style>
    </head>

    <body>
        <div id="chatbox">        </div>
        <form id="submit" action=/send_message method="POST">
        <div id="emoji-container" style="display: inline-block; vertical-align: middle;">
            <button type="button" id="emoji-trigger"><center>😀</center></button>
            <emoji-picker id="picker" class="hidden"></emoji-picker>
    </div>


        <input type="text" autocomplete="off" id="message_text" placeholder="Your message"><button type="button" id='send' onclick='sendmessage()'>Send</button></form>
    <div id="navbar">
    <button class='btn' id='register' onclick="window.location.href='/register'"><strong>Register!</strong></button>
    <button class='btn' onclick="window.location.href='/click'"><strong>Click!</strong></button>
    <button class='btn' onclick='window.location.href = "/inventory"'><strong>Inventory!</strong></button>
    <button class='btn' onclick="window.location.href='/shop'"><strong>Shop!</strong></button>
    <button class='btn' onclick="window.location.href='/changelog'"><strong>Changelog!</strong></button>
    </div><p style="color: #ff8000; text-align: center; font-size: 24px; text-decoration: underline;"><strong>News</strong></p>
        <p style="color: #ff8000; text-align: center; font-size: 18px;"><strong>Hey guys! We had a little balancing issue yesterday, and in the process, I had to make some changes and reset inventories. I apologize for the inconvenience, but you have been compensated with a huge amount of globes, and a shop buff. Shop is now much cheaper, so have fun!</strong></p>
        <div style="color: #ff8000; text-align: center; font-size: 18px;">
        <strong></strong>
        <ul style="list-style-position: inside; padding: 0; font-weight: bold;">
        <li></li>
        <li></li>
        <li></li>
        </ul>
    </div>
        <script>
            if (window.location.protocol === 'http:') {
                window.location.replace(window.location.href.replace('http:', 'https:'));
            }
            const etrigger = document.querySelector('#emoji-trigger');
            const epicker = document.querySelector('#picker');

            etrigger.addEventListener('click', () => {
                picker.classList.toggle('hidden');
            });


            document.addEventListener('click', (e) => {
                if (!epicker.contains(e.target) && e.target !== etrigger) {
                    epicker.classList.add('hidden');
                }
            });

            document.querySelector('emoji-picker').addEventListener('emoji-click', event => {
                const input = document.getElementById('message_text');
                input.value += event.detail.unicode;
                input.focus();
            });

            window.onload = changebutton;
            function changebutton() {
                fetch('/user/info')
                .then(response => response.json())
                .then(user => {
                    if (user.isguest === false) {
                        document.getElementById('register').innerText = user.username;
                        document.getElementById('register').onclick = () => { window.location.href = '/user/info'; };
                    }
                });
            }
            function clickpageredir() {
                window.location.href = '/click'
            }
            function registerpageredir() {
                window.location.href = '/register'
            }

            updateMessages();

            input = document.getElementById('message_text');
            input.addEventListener('keydown', checkenter);
            function checkenter(event) {
                if (event.key == 'Enter') {
                    event.preventDefault();
                    sendmessage();
                }}
            let isnewmessage = true;
            function sendmessage() {

                const message = document.getElementById('message_text').value;
                if (message == '') {
                    return;
                }
                fetch('/send_message', {
                    method: 'POST',
                    //username=${encodeURIComponent(username)}&
                    body: `message_text=${encodeURIComponent(message)}&room_id=0`,
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
                }).then(() => {
                    document.getElementById('message_text').value = '';
                    isnewmessage = true
                    updateMessages();
                });


            }
            function updateMessages() {
                fetch('/receive_message').then(response => response.json())
                    .then(messages => {
                        const chatbox = document.getElementById('chatbox')
                        chatbox.innerHTML = '';
                        messages.forEach(msg => {
                        let style = null;
                        let rainbow = null;
                        if (msg.colorinfo === "TRIGGER:rainbow;") {
                            rainbow = "rainbow";
                        }
                        else {

                            style = msg.colorinfo;
                        }

                        chatbox.innerHTML += `
                            <p class="${rainbow}" style="${style}">
                            <i>${new Date(msg.timestamp * 1000).toLocaleTimeString()} </i>
                            <strong id='guest'>${msg.username}</strong>|Tier ${msg.level}|: ${msg.text}
                            </p>`;

                        if (isnewmessage) {
                            isnewmessage = false;
                            setTimeout(() => {
                            chatbox.scrollTop = chatbox.scrollHeight;
                                }, 0);
                        }

                        });
                    });

            }
            setInterval(updateMessages, 2000);
        </script>
    </body>
    </html>
